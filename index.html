<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG & FIX</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; }
        #output { margin-top: 20px; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <button id="btn">START SENSORS</button>
    <div id="output">Warte auf Klick...</div>

    <script>
        document.getElementById('btn').onclick = function() {
            // 1. Apple-Erlaubnis anfordern
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response == 'granted') {
                        window.addEventListener('deviceorientation', (e) => {
                            let val = e.webkitCompassHeading || (360 - e.alpha);
                            document.getElementById('output').innerText = "Winkel: " + Math.round(val) + "°";
                        });
                        document.getElementById('output').innerText = "Sensor AKTIV!";
                    } else {
                        document.getElementById('output').innerText = "Verweigert!";
                    }
                })
                .catch(console.error);
            } else {
                // Non-iOS Geräte
                window.addEventListener('deviceorientation', (e) => {
                    let val = e.webkitCompassHeading || (360 - e.alpha);
                    document.getElementById('output').innerText = "Winkel: " + Math.round(val) + "°";
                });
            }
        };
    </script>
</body>
</html>
