<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG TEST</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff; }
        #debug { font-family: monospace; font-size: 20px; color: red; margin-top: 20px; }
        #needle { width: 10px; height: 100px; background: black; transform-origin: center bottom; }
    </style>
</head>
<body>
    <div id="needle"></div>
    <div id="debug">Drücke Start</div>
    <button id="start">START SENSOR</button>

    <script>
        document.getElementById('start').onclick = function() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', handle);
                });
            } else {
                window.addEventListener('deviceorientation', handle);
            }
        };

        function handle(e) {
            let heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : (360 - e.alpha);
            document.getElementById('needle').style.transform = `rotate(${heading}deg)`;
            document.getElementById('debug').innerText = "Winkel: " + Math.round(heading);
        }
    </script>
</body>
</html>
