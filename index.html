<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Panzerknacker III</title>
    <style>
        body { margin: 0; background: #e0e5ec; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; background: #fff; }
        .screen.active { display: flex; }
        .box { border: 4px solid #000; padding: 20px; background: #fff; box-shadow: 6px 6px 0px #000; width: 85%; max-width: 300px; text-align: center; }
        h1 { background: #ff5722; color: #fff; padding: 10px; border: 4px solid #000; margin: 0 0 10px 0; text-transform: uppercase; }
        button { padding: 15px 30px; font-weight: 900; border: 4px solid #000; background: #ff5722; color: #fff; cursor: pointer; }
        #needle { width: 8px; height: 100px; background: #d50000; transform-origin: 50% 100%; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <div class="box">
            <h1>PANZERKNACKER</h1>
            <button id="start-btn">TRESOR ANGREIFEN</button>
            <div id="debug" style="font-size:12px; margin-top:10px;">Bereit</div>
        </div>
    </div>

    <div id="level-1" class="screen">
        <div class="box">
            <h1>K1: UPLINK</h1>
            <div id="needle"></div>
            <p id="status">Drehe das Gerät!</p>
        </div>
    </div>

    <script>
        let sensor = { alpha: 0 };

        function handle(e) {
            sensor.alpha = e.webkitCompassHeading || (360 - (e.alpha || 0));
            document.getElementById('debug').innerText = "Winkel: " + Math.round(sensor.alpha) + "°";
            
            // Nadel im Level 1 drehen
            const needle = document.getElementById('needle');
            if (needle) needle.style.transform = `rotate(${sensor.alpha}deg)`;
        }

        document.getElementById('start-btn').onclick = function() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') {
                        window.addEventListener('deviceorientation', handle);
                        document.getElementById('start-screen').classList.remove('active');
                        document.getElementById('level-1').classList.add('active');
                    }
                });
            } else {
                window.addEventListener('deviceorientation', handle);
                document.getElementById('start-screen').classList.remove('active');
                document.getElementById('level-1').classList.add('active');
            }
        };
    </script>
</body>
</html>
