<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Jukebox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e; 
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .jukebox-container {
            position: relative; 
            width: 100%;
            max-width: 800px; 
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jukebox-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1; 
        }

        /* 
         * HIER IST DER WICHTIGE BEREICH FÜR DIE AUSRICHTUNG!
         * Wenn die roten Boxen nicht perfekt auf den Tasten liegen, 
         * ändere diese Prozent-Zahlen in kleinen Schritten (z.B. von 27.5% auf 28%).
         */
        .button-overlay {
            position: absolute;
            
            top: 24.5%;      /* Schiebt das Raster nach oben/unten */
            left: 27.5%;     /* Schiebt das Raster nach links/rechts */
            width: 45.0%;    /* Macht das gesamte Raster breiter/schmaler */
            height: 66.0%;   /* Macht das gesamte Raster höher/flacher */

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            
            /* Der Abstand ZWISCHEN den einzelnen Tasten: 
               Erster Wert (1.5%) = vertikaler Abstand (oben/unten)
               Zweiter Wert (2.5%) = horizontaler Abstand (links/rechts) */
            gap: 1.5% 2.5%; 
            
            z-index: 2; 
        }

        .jukebox-button {
            /* Wie gewünscht: Leicht rötlich eingefärbt */
            background-color: rgba(255, 80, 80, 0.35); 
            border: none;
            border-radius: 20%; /* Macht die Ecken der roten Boxen rund, passend zur Jukebox */
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .jukebox-button:hover {
            background-color: rgba(255, 80, 80, 0.6);
            box-shadow: 0 0 12px rgba(255, 80, 80, 0.5); 
        }

        .jukebox-button:active {
            background-color: rgba(255, 50, 50, 0.8);
            transform: scale(0.92);
        }

        .response-area {
            background-color: #2a2a2a;
            color: #ffcccc;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
            box-shadow: inset 0 0 10px #000;
            border: 1px solid #444;
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="jukebox-container">
        <!-- Dateiname auf jukebox.jpg geändert -->
        <img src="jukebox.jpg" alt="Jukebox" class="jukebox-image">

        <div class="button-overlay">
            <!-- Reihe 1 -->
            <button class="jukebox-button" onclick="playSong('Track 01: Die Stille')"></button>
            <button class="jukebox-button" onclick="playSong('Track 02: Der Schatten')"></button>
            <button class="jukebox-button" onclick="playSong('Track 03: Geheime Klänge')"></button>
            <button class="jukebox-button" onclick="playSong('Track 04: Flüsternde Winde')"></button>
            <button class="jukebox-button" onclick="playSong('Track 05: Alte Lieder')"></button>
            
            <!-- Reihe 2 -->
            <button class="jukebox-button" onclick="playSong('Track 06: Im Dunkeln')"></button>
            <button class="jukebox-button" onclick="playSong('Track 07: Der Schlüssel')"></button>
            <button class="jukebox-button" onclick="playSong('Track 08: Verborgene Wege')"></button>
            <button class="jukebox-button" onclick="playSong('Track 09: Zeitlose Noten')"></button>
            <button class="jukebox-button" onclick="playSong('Track 10: Der Zauber')"></button>
            
            <!-- Reihe 3 -->
            <button class="jukebox-button" onclick="playSong('Track 11: Der Echoraum')"></button>
            <button class="jukebox-button" onclick="playSong('Track 12: Geheime Melodien')"></button>
            <button class="jukebox-button" onclick="playSong('Track 13: Die Ferne')"></button>
            <button class="jukebox-button" onclick="playSong('Track 14: Das Abenteuer')"></button>
            <button class="jukebox-button" onclick="playSong('Track 15: Die Suche')"></button>
            
            <!-- Reihe 4 -->
            <button class="jukebox-button" onclick="playSong('Track 16: Ein Geheimnis')"></button>
            <button class="jukebox-button" onclick="playSong('Track 17: Die Verwandlung')"></button>
            <button class="jukebox-button" onclick="playSong('Track 18: Das Echo')"></button>
            <button class="jukebox-button" onclick="playSong('Track 19: Das Versprechen')"></button>
            <button class="jukebox-button" onclick="playSong('Track 20: Der Pfad')"></button>
            
            <!-- Reihe 5 -->
            <button class="jukebox-button" onclick="playSong('Track 21: Der letzte Schritt')"></button>
            <button class="jukebox-button" onclick="playSong('Track 22: Die Ankunft')"></button>
            <button class="jukebox-button" onclick="playSong('Track 23: Die Wahrheit')"></button>
            <button class="jukebox-button" onclick="playSong('Track 24: Der Weg')"></button>
            <button class="jukebox-button" onclick="playSong('Track 25: Der Sieg')"></button>
        </div>
    </div>

    <div class="response-area" id="responseArea">Wähle einen Titel...</div>

    <script>
        function playSong(songName) {
            document.getElementById('responseArea').innerText = "▶ Spiele: " + songName;
        }
    </script>

</body>
</html>
