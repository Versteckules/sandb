<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Projekt Jukebox – Interaktives Geocaching-Rätsel. Erkenne 25 Songs, gib die Titel ein und entschlüssle die finalen Koordinaten." />

  <title>Projekt Jukebox</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/jukebox.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ========================================================
       HEADER – Logo, Sprach-Toggle, Fortschritt
  ======================================================== -->
  <header id="site-header">
    <div id="header-logo">
      <h1 data-i18n="title">PROJEKT JUKEBOX</h1>
    </div>

    <div id="header-controls">
      <!-- Sprach-Toggle -->
      <button id="lang-toggle" data-i18n="lang-toggle" aria-label="Sprache wechseln / Switch language">
        🇩🇪 DE | EN 🇬🇧
      </button>

      <!-- Fortschrittsanzeige -->
      <div id="progress-display" aria-label="Fortschrittsanzeige">
        <span id="solved-count">0</span>
        <span data-i18n="progress-separator"> / </span>
        <span id="total-count">25</span>
        <span data-i18n="progress-label"> gelöst</span>
      </div>

      <!-- Hinweis Lösungsschwelle -->
      <div id="solve-hint" aria-label="Lösungshinweis">
        <span data-i18n="solve-hint">21 zum Lösen</span>
      </div>
    </div>
  </header>

  <!-- ========================================================
       MAIN – Jukebox-Gehäuse mit U-förmigem LED-Equalizer
  ======================================================== -->
  <main id="main-content">
    <!-- Jukebox-Gehäuse -->
    <div id="jukebox-cabinet" aria-label="Jukebox-Gehäuse">

      <!-- U-förmige LED-Leiste (Equalizer schmiegt sich direkt ans Gehäuse) -->
      <div id="led-bar" aria-hidden="true">
        <!-- Linker Equalizer (10 LEDs von unten nach oben) -->
        <div class="led-strip led-strip-left" aria-label="Equalizer links">
          <div class="led" id="led-l-1"></div>
          <div class="led" id="led-l-2"></div>
          <div class="led" id="led-l-3"></div>
          <div class="led" id="led-l-4"></div>
          <div class="led" id="led-l-5"></div>
          <div class="led" id="led-l-6"></div>
          <div class="led" id="led-l-7"></div>
          <div class="led" id="led-l-8"></div>
          <div class="led" id="led-l-9"></div>
          <div class="led" id="led-l-10"></div>
        </div>

        <!-- Untere Leiste (12 LEDs) -->
        <div class="led-strip led-strip-bottom" aria-label="LED Leiste unten">
          <div class="led" id="led-b-1"></div>
          <div class="led" id="led-b-2"></div>
          <div class="led" id="led-b-3"></div>
          <div class="led" id="led-b-4"></div>
          <div class="led" id="led-b-5"></div>
          <div class="led" id="led-b-6"></div>
          <div class="led" id="led-b-7"></div>
          <div class="led" id="led-b-8"></div>
          <div class="led" id="led-b-9"></div>
          <div class="led" id="led-b-10"></div>
          <div class="led" id="led-b-11"></div>
          <div class="led" id="led-b-12"></div>
        </div>

        <!-- Rechter Equalizer (10 LEDs von unten nach oben) -->
        <div class="led-strip led-strip-right" aria-label="Equalizer rechts">
          <div class="led" id="led-r-1"></div>
          <div class="led" id="led-r-2"></div>
          <div class="led" id="led-r-3"></div>
          <div class="led" id="led-r-4"></div>
          <div class="led" id="led-r-5"></div>
          <div class="led" id="led-r-6"></div>
          <div class="led" id="led-r-7"></div>
          <div class="led" id="led-r-8"></div>
          <div class="led" id="led-r-9"></div>
          <div class="led" id="led-r-10"></div>
        </div>
      </div>

      <div id="song-grid" aria-label="Song-Auswahl" role="list">
        <!--
          *** PLATZHALTER: 25 Song-Buttons werden hier von ui.js dynamisch eingefügt ***
          Schritt 4 (UI-Logik) befüllt diesen Bereich mit folgendem Muster pro Eintrag:

          <div class="song-entry" role="listitem" data-song-id="N">
            <button class="song-button" id="song-btn-N" data-song-id="N" aria-label="Song N abspielen">
              N
            </button>
            <div class="song-label" id="song-label-N">
              <span class="song-label-text"><!-- blur bis gelöst --></span>
            </div>
          </div>
        -->
      </div>

    </div>
  </main>

  <!-- ========================================================
       MODAL – Song-Eingabe (initial versteckt)
  ======================================================== -->
  <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div id="modal-box">

      <h2 id="modal-title" data-i18n="modal-title">Song #<span id="modal-song-number"></span></h2>

      <!-- Vorschau-Schild (blur solange ungelöst) -->
      <div id="modal-label-preview" aria-label="Song-Schild">
        <p id="modal-preview-title" class="blurred"></p>
        <p id="modal-preview-artist" class="blurred"></p>
      </div>

      <!-- Eingabefeld -->
      <label for="modal-input" id="modal-input-label" data-i18n="modal-input-label">
        Titel oder Interpret eingeben:
      </label>
      <input
        type="text"
        id="modal-input"
        name="modal-input"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        data-i18n-placeholder="modal-input-placeholder"
        placeholder="Deine Antwort…"
      />

      <!-- Aktionsbuttons -->
      <div id="modal-actions">
        <button id="modal-submit" data-i18n="modal-submit">Bestätigen</button>
        <button id="modal-close" data-i18n="modal-close">Schließen</button>
      </div>

    </div>
  </div>

  <!-- ========================================================
       KOORDINATEN-OVERLAY – erscheint ab 21 gelösten Songs (initial versteckt)
  ======================================================== -->
  <div id="coords-overlay" role="dialog" aria-modal="true" aria-labelledby="coords-title" hidden>
    <div id="coords-box">

      <h2 id="coords-title" data-i18n="coords-title">🎉 Zielkoordinaten</h2>
      <p id="coords-subtitle" data-i18n="coords-subtitle">Du hast genug Songs erkannt!</p>

      <div id="coords-display" aria-label="Koordinaten">
        <!-- Koordinaten werden zur Laufzeit per solver.js dekodiert und eingefügt -->
      </div>

      <button id="coords-copy" data-i18n="coords-copy">Koordinaten kopieren</button>
      <button id="coords-close" data-i18n="coords-close">Schließen</button>

    </div>
  </div>

  <!-- ========================================================
       TOAST – Feedback-Meldung (initial versteckt)
  ======================================================== -->
  <div id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
  </div>

  <!-- ========================================================
       SCRIPTS – Ladereihenfolge gemäß architecture.md:
       songs.js → i18n.js → audio.js → solver.js → state.js → ui.js
  ======================================================== -->
  <script src="js/songs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>

</body>
</html>
