<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panzerknacker III</title>
    <style>
        :root { --bg: #e0e5ec; --accent: #ff5722; --border: 4px solid #000; }
        body { margin: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        
        #start-screen { text-align: center; border: var(--border); padding: 30px; background: #fff; box-shadow: 6px 6px 0px #000; }
        h1 { background: var(--accent); color: #fff; padding: 10px; border: var(--border); margin-bottom: 10px; }
        .by { font-weight: 900; background: #000; color: #fff; padding: 5px; }
        button { margin-top: 20px; padding: 15px 30px; font-weight: 900; cursor: pointer; border: var(--border); background: var(--accent); color: #fff; }
        #debug { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="start-screen">
        <img src="avatar.jpg" alt="Versteckules" style="width:100px; border-radius:50%; border:var(--border);">
        <h1>Panzerknacker III</h1>
        <div class="by">by Versteckules</div>
        <button id="start-btn">Tresor Angreifen</button>
        <div id="debug">Warte auf Sensor-Freigabe...</div>
    </div>

    <script>
        let tComp = 0;

        document.getElementById('start-btn').onclick = function() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', handle);
                });
            } else {
                window.addEventListener('deviceorientation', handle);
            }
        };

        function handle(e) {
            tComp = e.webkitCompassHeading || (360 - e.alpha);
            document.getElementById('debug').innerText = "Winkel: " + Math.round(tComp) + "°";
        }
    </script>
</body>
</html>
