<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Panzerknacker III - Basis</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #e0e5ec; margin: 0; }
        .box { border: 4px solid #000; padding: 30px; background: #fff; box-shadow: 6px 6px 0px #000; text-align: center; }
        button { padding: 20px 40px; font-size: 20px; font-weight: 900; cursor: pointer; background: #ff5722; color: #fff; border: 4px solid #000; }
        #debug { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Panzerknacker III</h1>
        <button id="start-btn">Tresor Angreifen</button>
        <div id="debug">Warte auf Start...</div>
    </div>

    <script>
        let sensorData = { alpha: 0 };

        function handleSensors(e) {
            // Die exakte, funktionierende Logik aus deinem Test
            let comp = e.webkitCompassHeading;
            sensorData.alpha = (comp !== undefined && comp !== null) ? comp : (360 - e.alpha);
            document.getElementById('debug').innerText = "Winkel: " + Math.round(sensorData.alpha) + "°";
        }

        document.getElementById('start-btn').onclick = function() {
            // 1. Berechtigung anfordern
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleSensors);
                        document.getElementById('debug').innerText = "Sensoren aktiv!";
                    } else {
                        alert("Berechtigung verweigert!");
                    }
                }).catch(err => alert("Fehler: " + err));
            } else {
                // Für Browser, die keine explizite Erlaubnis brauchen
                window.addEventListener('deviceorientation', handleSensors);
                document.getElementById('debug').innerText = "Sensoren aktiv!";
            }
        };
    </script>
</body>
</html>
